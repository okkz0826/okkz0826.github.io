<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログピン ログイン</title>
<style>
  body { font-family: sans-serif; background:#fff; color:#111; margin:0; padding:40px 20px; text-align:center; }
  h1 { font-size:20px; margin-bottom:8px; }
  p { color:#555; font-size:14px; line-height:1.7; }
  button { background:#111; color:#fff; border:0; border-radius:999px; padding:14px 28px; font-size:16px; cursor:pointer; }
  .code { font-size:44px; font-weight:bold; letter-spacing:10px; margin:20px 0 4px; }
  .hidden { display:none; }
  .detail { font-size:11px; color:#999; word-break:break-all; margin-top:16px; text-align:left; }
</style>
</head>
<body>
  <h1>ログピン ログイン</h1>
  <div id="step-login">
    <p>Googleでログインすると、アプリに入力するための<br>6桁のコードが表示されます。</p>
    <button id="btn">Googleでログイン</button>
  </div>
  <div id="step-code" class="hidden">
    <p>ログインできました。<br>アプリに戻って、このコードを入力してください。</p>
    <div class="code" id="code">------</div>
    <p>コードは10分間有効です。</p>
  </div>
  <div id="step-error" class="hidden">
    <p>うまくいきませんでした。もう一度お試しください。</p>
    <button onclick="location.href=location.pathname">最初からやり直す</button>
    <p class="detail" id="detail"></p>
  </div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const FUNCTION_URL = "https://qsogdmbornmkkxxknwnt.supabase.co/functions/v1/auth-callback";
const sb = createClient("https://qsogdmbornmkkxxknwnt.supabase.co", "sb_publishable_Rt0Tu9YOzIH_UGtw28qAIw_eo8WTDh_");
const show = (id, detail) => {
  for (const s of ["step-login", "step-code", "step-error"]) {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  }
  if (id === "step-error" && detail) {
    document.getElementById("detail").textContent = detail;
  }
};
document.getElementById("btn").addEventListener("click", async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: location.origin + location.pathname },
  });
  if (error) show("step-error", "start: " + error.message);
});
let handled = false;
const handleSession = async (session) => {
  if (handled || !session) return;
  handled = true;
  try {
    const res = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        access_token: session.access_token,
        refresh_token: session.refresh_token,
      }),
    });
    const json = await res.json();
    if (json.code) {
      document.getElementById("code").textContent = json.code;
      show("step-code");
    } else {
      show("step-error", "store: " + JSON.stringify(json));
    }
  } catch (e) {
    show("step-error", "exception: " + (e && e.message ? e.message : String(e)));
  }
};
const params = new URLSearchParams(location.search);
const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
const errText = params.get("error_description") || params.get("error") || hashParams.get("error_description") || hashParams.get("error");
if (errText) {
  show("step-error", "returned: " + errText);
}
sb.auth.onAuthStateChange((_event, session) => {
  if (session) handleSession(session);
});
const { data } = await sb.auth.getSession();
if (data.session) {
  handleSession(data.session);
} else if (params.get("code")) {
  const { data: exData, error: exError } = await sb.auth.exchangeCodeForSession(params.get("code"));
  if (exError) {
    show("step-error", "exchange: " + exError.message);
  } else if (exData.session) {
    handleSession(exData.session);
  }
}
</script>
</body>
</html>
